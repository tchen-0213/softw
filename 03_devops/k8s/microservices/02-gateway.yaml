apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: softw-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: softw/api-gateway:practice
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_VERSION
              value: "2.0.0"
            - name: USER_SERVICE_URL
              value: http://user-service:3101
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:3102
            - name: ORDER_SERVICE_URL
              value: http://order-service:3103
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: softw-microservices
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
