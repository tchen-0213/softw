apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: softw-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: softw/api-gateway:practice
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_VERSION
              value: "2.0.0"
            - name: USER_SERVICE_URL
              value: http://user-service:3101
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:3102
            - name: ORDER_SERVICE_URL
              value: http://order-service:3103
            - name: CORS_ORIGINS
              value: http://localhost:8082,http://127.0.0.1:8082,http://localhost:30082,http://127.0.0.1:30082,https://tchen-0213.github.io,https://*.app.github.dev
            - { name: RATE_LIMIT_WINDOW_MS, value: "60000" }
            - { name: RATE_LIMIT_MAX, value: "120" }
            - { name: GATEWAY_BODY_LIMIT, value: "2mb" }
            - { name: PROXY_TIMEOUT_MS, value: "3000" }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: softw-microservices
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
