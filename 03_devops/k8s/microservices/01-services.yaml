apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: softw-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: softw/user-service:practice
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3101
          env:
            - name: PORT
              value: "3101"
            - name: SERVICE_NAME
              value: user-service
            - { name: SERVICE_VERSION, value: "2.0.0" }
            - { name: DB_HOST, value: microservice-mysql }
            - { name: DB_NAME, value: softw_users }
            - { name: DB_USER, value: softw }
            - { name: DB_PASSWORD, value: softw_password }
            - { name: JWT_SECRET, value: microservice_dev_secret }
            - { name: INTERNAL_SERVICE_TOKEN, value: microservice_internal_token }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3101
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: softw-microservices
spec:
  selector:
    app: user-service
  ports:
    - port: 3101
      targetPort: 3101
---
