name: softw

services:
  mysql:
    image: mysql:8.0
    container_name: softw-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${SOFTW_MYSQL_ROOT_PASSWORD:?run sh 03_devops/scripts/init-local-env.sh}
      MYSQL_DATABASE: shopping_platform
      MYSQL_USER: softw
      MYSQL_PASSWORD: ${SOFTW_DB_PASSWORD:?run sh 03_devops/scripts/init-local-env.sh}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../backend
    container_name: softw-backend
    command: sh -c "node seedDemoProducts.js && node app.js"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: softw
      DB_PASSWORD: ${SOFTW_DB_PASSWORD:?run sh 03_devops/scripts/init-local-env.sh}
      DB_NAME: shopping_platform
      JWT_SECRET: ${SOFTW_JWT_SECRET:?run sh 03_devops/scripts/init-local-env.sh}
      JWT_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080,https://tchen-0213.github.io,https://*.app.github.dev,https://*.trycloudflare.com
      RATE_LIMIT_MAX: 300
    ports:
      - "3001:3001"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../frontend
    container_name: softw-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  uploads-data:
