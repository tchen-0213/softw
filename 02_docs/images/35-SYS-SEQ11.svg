<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="title desc"><title id="title">SYS-SEQ11 取消订单并恢复库存</title><desc id="desc">SYS-SEQ11 取消订单并恢复库存，展示参与组件及主要成功和异常交互。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#334155"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.actor{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}.actorText{font-size:14px;font-weight:600}.life{stroke:#94a3b8;stroke-dasharray:6 5}.msg{stroke:#334155;stroke-width:1.4;marker-end:url(#arrow)}.reply{stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrow)}.label{font-size:13px}.note{fill:#fff7ed;stroke:#fb923c}</style></defs><rect width="100%" height="100%" fill="#ffffff"/><text class="title" x="590" y="36" text-anchor="middle">SYS-SEQ11 取消订单并恢复库存</text><rect class="actor" x="4" y="72" width="132" height="42" rx="6"/><text class="actorText" x="70" y="98" text-anchor="middle">买家</text><line class="life" x1="70" y1="114" x2="70" y2="422"/><rect class="actor" x="1044" y="72" width="132" height="42" rx="6"/><text class="actorText" x="1110" y="98" text-anchor="middle">购物平台</text><line class="life" x1="1110" y1="114" x2="1110" y2="422"/><line class="msg" x1="70" y1="145" x2="1102" y2="145"/><text class="label" x="590" y="136" text-anchor="middle">取消本人待付款订单</text><line class="msg" x1="undefined" y1="205" x2="NaN" y2="205"/><text class="label" x="NaN" y="196" text-anchor="middle">校验归属和可取消状态</text><line class="msg" x1="undefined" y1="265" x2="NaN" y2="265"/><text class="label" x="NaN" y="256" text-anchor="middle">事务内恢复库存并标记已取消</text><line class="reply" x1="1110" y1="325" x2="78" y2="325"/><text class="label" x="590" y="316" text-anchor="middle">返回已取消订单</text><line class="msg" x1="undefined" y1="385" x2="NaN" y2="385"/><text class="label" x="NaN" y="376" 