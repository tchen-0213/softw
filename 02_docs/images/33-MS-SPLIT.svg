<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MS-SPLIT 微服务划分图</title>
  <desc id="desc">展示前端、API 网关、已落地服务、待迁移服务、共享 MySQL 和上传文件卷之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "PingFang SC", sans-serif; fill: #172033; }
      .subtitle { font: 15px Arial, "PingFang SC", sans-serif; fill: #526071; }
      .group-title { font: 700 18px Arial, "PingFang SC", sans-serif; fill: #172033; }
      .name { font: 700 17px Arial, "PingFang SC", sans-serif; fill: #172033; }
      .detail { font: 14px Arial, "PingFang SC", sans-serif; fill: #526071; }
      .status { font: 700 13px Arial, "PingFang SC", sans-serif; }
      .edge-label { font: 13px Arial, "PingFang SC", sans-serif; fill: #526071; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .planned-edge { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="44" y="48" class="title">MS-SPLIT 微服务划分图</text>
  <text x="44" y="76" class="subtitle">实线：已落地并通过 CI/Kubernetes 验证　　虚线：边界已确定，完整业务当前由单体承载</text>

  <rect x="42" y="270" width="200" height="88" rx="6" fill="#eef6ff" stroke="#2563a6" stroke-width="2"/>
  <text x="142" y="307" text-anchor="middle" class="name">React Frontend</text>
  <text x="142" y="334" text-anchor="middle" class="detail">UC01-UC09 页面入口</text>

  <rect x="310" y="270" width="220" height="88" rx="6" fill="#fff7e8" stroke="#c26a12" stroke-width="2"/>
  <text x="420" y="307" text-anchor="middle" class="name">API Gateway</text>
  <text x="420" y="334" text-anchor="middle" class="detail">路由 · 超时 · 503 降级</text>
  <path d="M242 314 H310" class="edge"/>

  <rect x="620" y="100" width="730" height="288" rx="6" fill="#f4fbf6" stroke="#2f855a" stroke-width="2"/>
  <text x="648" y="134" class="group-title">已落地的独立服务</text>
  <text x="1320" y="134" text-anchor="end" class="status" fill="#237a4b">CI/CD：构建、测试、镜像、K8s 健康检查通过</text>

  <rect x="675" y="170" width="190" height="130" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="770" y="205" text-anchor="middle" class="name">user-service</text>
  <text x="770" y="234" text-anchor="middle" class="detail">用户 · 认证 · 地址</text>
  <text x="770" y="266" text-anchor="middle" class="status" fill="#237a4b">查询接口已独立</text>

  <rect x="895" y="170" width="200" height="130" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="995" y="205" text-anchor="middle" class="name">product-service</text>
  <text x="995" y="234" text-anchor="middle" class="detail">商品 · 二手 · 店铺</text>
  <text x="995" y="266" text-anchor="middle" class="status" fill="#237a4b">查询与压测接口已独立</text>

  <rect x="1125" y="170" width="180" height="130" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="1215" y="205" text-anchor="middle" class="name">order-service</text>
  <text x="1215" y="234" text-anchor="middle" class="detail">订单 · 状态 · 依赖</text>
  <text x="1215" y="266" text-anchor="middle" class="status" fill="#237a4b">查询与降级已独立</text>

  <path d="M530 294 H575 V150 H770 V170" class="edge"/>
  <path d="M575 150 H995 V170" class="edge"/>
  <path d="M575 150 H1215 V170" class="edge"/>
  <path d="M1215 300 V325 H1095 V300" class="edge"/>
  <text x="1090" y="346" text-anchor="end" class="edge-label">商品依赖检查</text>

  <rect x="620" y="430" width="730" height="206" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="648" y="464" class="group-title">边界已确定，当前保留在单体</text>
  <text x="1320" y="464" text-anchor="end" class="status" fill="#64748b">单体接口已实现 · 独立服务待迁移</text>

  <rect x="675" y="494" width="190" height="104" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="770" y="530" text-anchor="middle" class="name">evaluation-service</text>
  <text x="770" y="559" text-anchor="middle" class="detail">评价 · 审核 · 信用联动</text>

  <rect x="895" y="494" width="200" height="104" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="995" y="530" text-anchor="middle" class="name">chat-service</text>
  <text x="995" y="559" text-anchor="middle" class="detail">会话 · 消息 · 议价</text>

  <rect x="1125" y="494" width="180" height="104" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1215" y="530" text-anchor="middle" class="name">file-service</text>
  <text x="1215" y="559" text-anchor="middle" class="detail">图片校验 · 文件存储</text>

  <path d="M530 334 H575 V475 H770 V494" class="planned-edge"/>
  <path d="M575 475 H995 V494" class="planned-edge"/>
  <path d="M575 475 H1215 V494" class="planned-edge"/>

  <rect x="655" y="704" width="360" height="80" rx="6" fill="#f5f3ff" stroke="#6d5fb3" stroke-width="2"/>
  <text x="835" y="736" text-anchor="middle" class="name">共享 MySQL 8</text>
  <text x="835" y="763" text-anchor="middle" class="detail">当前共享实例 · 每张表设置唯一逻辑所有者</text>

  <rect x="1080" y="704" width="250" height="80" rx="6" fill="#fff7ed" stroke="#b85c25" stroke-width="2"/>
  <text x="1205" y="736" text-anchor="middle" class="name">uploads 文件卷</text>
  <text x="1205" y="763" text-anchor="middle" class="detail">仅 file-service 写入</text>

  <path d="M650 388 H600 V670 H835 V704" class="edge"/>
  <path d="M995 636 V670 H835 V704" class="planned-edge"/>
  <path d="M1215 598 V704" class="planned-edge"/>

  <rect x="42" y="704" width="500" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="733" class="detail">验收口径：</text>
  <text x="62" y="759" class="detail">完整 UC01-UC09 由单体运行；独立微服务用于拆分、部署、路由和降级验证。</text>
</svg>
