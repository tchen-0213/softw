name: softw-ci-cd

on:
  workflow_dispatch:
    inputs:
      run_failure_drill:
        description: Deploy an invalid image, collect diagnostics, and roll back
        required: false
        type: boolean
        default: false
  push:
    branches: [main, develop, practice/**, issue/**]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: shopping_platform
          MYSQL_USER: softw
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: softw
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME: shopping_platform
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CORS_ORIGIN: http://127.0.0.1:5173
      RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Start backend for API integration tests
        run: |
          npm start > /tmp/softw-backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/softw-backend.log
          exit 1
        working-directory: backend
      - name: Verify database migrations
        run: npm run db:migrate:status
        working-directory: backend
      - name: Run complete API business flow
        run: npm run test:api
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: 04_tests/reports/coverage/frontend
          retention-days: 7
      - run: npm run build
        working-directory: frontend

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify security and cloud-native experiment configuration
        run: node --test 04_tests/security/config-security.test.js 04_tests/performance/hpa-fault-config.test.js
      - name: Scan tracked files and production dependencies
        run: node 04_tests/security/run-security-scan.js 
      - name: Run Git history secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload security scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ github.sha }}
          path: 04_tests/reports/security/security-scan-*.json
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: shopping_platform
          MYSQL_USER: softw
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: softw
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME: shopping_platform
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CORS_ORIGIN: http://127.0.0.1:5173
      RATE_LIMIT_MAX: 1000
      API_BASE_URL: http://127.0.0.1:3001
      E2E_BASE_URL: http://127.0.0.1:5173
      VITE_API_TIMEOUT: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend and frontend
        run: |
          npm --prefix backend start > /tmp/softw-backend-e2e.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/softw-frontend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/softw-backend-e2e.log
          cat /tmp/softw-frontend-e2e.log
          exit 1
      - name: Run browser business flows
        run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            frontend/test-results
            04_tests/reports/playwright-html
            /tmp/softw-backend-e2e.log
            /tmp/softw-frontend-e2e.log
          if-no-files-found: ignore
          retention-days: 7

  microservice-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: softw_test
          MYSQL_USER: softw
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: softw_test
      DB_USER: softw
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      INTERNAL_SERVICE_TOKEN: ${{ secrets.CI_INTERNAL_SERVICE_TOKEN }}
    strategy:
      matrix:
        service: [user-service, product-service, order-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: services/${{ matrix.service }}
      - run: npm test
        working-directory: services/${{ matrix.service }}

  microservice-api-e2e:
    runs-on: ubuntu-latest
    env:
      SOFTW_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
      SOFTW_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      SOFTW_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      SOFTW_INTERNAL_SERVICE_TOKEN: ${{ secrets.CI_INTERNAL_SERVICE_TOKEN }}
      RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start the complete microservice topology
        run: docker compose -f 03_devops/docker-compose.microservices.yml up -d --build --wait
      - name: Record D6-02 test environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/d6-02"
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "gateway=http://127.0.0.1:8081"
            echo "frontend=http://127.0.0.1:8082"
            echo "schemas=softw_users,softw_catalog,softw_orders"
            node --version
            npm --version
            docker --version
            docker compose version
          } > "$RUNNER_TEMP/d6-02/environment.txt"
      - name: Run all public API and UC01-UC09 gateway regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:services:api 2>&1 | tee "$RUNNER_TEMP/d6-02/microservice-api-e2e.txt"
      - name: Run UC01-UC09 browser regression against microservices
        env:
          API_BASE_URL: http://127.0.0.1:8081
          E2E_BASE_URL: http://127.0.0.1:8082
        run: npm --prefix frontend run test:e2e
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose -f 03_devops/docker-compose.microservices.yml logs --no-color > "$RUNNER_TEMP/d6-02/microservice-compose.log"
      - name: Upload D6-02 API and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-02-microservice-regression-${{ github.sha }}
          path: |
            ${{ runner.temp }}/d6-02
            frontend/test-results
            04_tests/reports/playwright-html
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop test topology
        if: always()
        run: docker compose -f 03_devops/docker-compose.microservices.yml down -v

  deliverable-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit course deliverables
        run: npm run audit:deliverables
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: deliverables-audit-${{ github.sha }}
          path: 04_tests/reports/deliverables-audit.json
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan, browser-e2e, microservice-test, microservice-api-e2e, deliverable-audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: microservice-frontend
            context: frontend
            dockerfile: frontend/Dockerfile.microservices
          - image: api-gateway
            context: services
            dockerfile: services/api-gateway/Dockerfile
          - image: user-service
            context: services
            dockerfile: services/user-service/Dockerfile
          - image: product-service
            context: services
            dockerfile: services/product-service/Dockerfile
          - image: order-service
            context: services
            dockerfile: services/order-service/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          build-args: |
            SERVICE_VERSION=2.0.0
            SERVICE_REVISION=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  kubernetes-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Create deployment cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: softw-ci
          version: v0.32.0
          wait: 120s
      - name: Deploy monolith and microservices
        env:
          SOFTW_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          SOFTW_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          SOFTW_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SOFTW_INTERNAL_SERVICE_TOKEN: ${{ secrets.CI_INTERNAL_SERVICE_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sh 03_devops/scripts/create-k8s-secrets.sh
          kubectl -n softw-practice create secret docker-registry ghcr-credentials \
            --docker-server=${REGISTRY} \
            --docker-username=${GITHUB_ACTOR} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n softw-practice patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-credentials"}]}'
          kubectl -n softw-microservices create secret docker-registry ghcr-credentials \
            --docker-server=${REGISTRY} \
            --docker-username=${GITHUB_ACTOR} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n softw-microservices patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-credentials"}]}'
          sh 03_devops/scripts/deploy-k8s.sh "$IMAGE_PREFIX" "$IMAGE_TAG" \
            04_tests/reports/kubernetes-deployment
      - name: Run controlled deployment failure and rollback drill
        if: inputs.run_failure_drill == true
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sh 03_devops/scripts/run-deployment-failure-drill.sh \
            "$IMAGE_PREFIX" "$IMAGE_TAG" \
            04_tests/reports/kubernetes-deployment/failure-drill
      - name: Collect final Kubernetes state
        if: always()
        run: |
          sh 03_devops/scripts/k8s-collect-failure.sh softw-practice \
            04_tests/reports/kubernetes-deployment/monolith
          sh 03_devops/scripts/k8s-collect-failure.sh softw-microservices \
            04_tests/reports/kubernetes-deployment/microservices
      - name: Upload Kubernetes deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-deployment-${{ github.sha }}
          path: 04_tests/reports/kubernetes-deployment
          if-no-files-found: ignore
          retention-days: 14
