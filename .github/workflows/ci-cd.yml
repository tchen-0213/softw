name: softw-ci-cd

on:
  push:
    branches: [main, develop, practice/**]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: shopping_platform
          MYSQL_USER: softw
          MYSQL_PASSWORD: softw_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: softw
      DB_PASSWORD: softw_password
      DB_NAME: shopping_platform
      JWT_SECRET: github_actions_test_secret
      CORS_ORIGIN: http://127.0.0.1:5173
      RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Start backend for API integration tests
        run: |
          npm start > /tmp/softw-backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/softw-backend.log
          exit 1
        working-directory: backend
      - name: Verify database migrations
        run: npm run db:migrate:status
        working-directory: backend
      - name: Run complete API business flow
        run: npm run test:api
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: 04_tests/reports/coverage/frontend
          retention-days: 7
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: shopping_platform
          MYSQL_USER: softw
          MYSQL_PASSWORD: softw_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: softw
      DB_PASSWORD: softw_password
      DB_NAME: shopping_platform
      JWT_SECRET: github_actions_e2e_secret
      CORS_ORIGIN: http://127.0.0.1:5173
      RATE_LIMIT_MAX: 1000
      API_BASE_URL: http://127.0.0.1:3001
      E2E_BASE_URL: http://127.0.0.1:5173
      VITE_API_TIMEOUT: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend and frontend
        run: |
          npm --prefix backend start > /tmp/softw-backend-e2e.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/softw-frontend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/softw-backend-e2e.log
          cat /tmp/softw-frontend-e2e.log
          exit 1
      - name: Run browser business flows
        run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            frontend/test-results
            04_tests/reports/playwright-html
            /tmp/softw-backend-e2e.log
            /tmp/softw-frontend-e2e.log
          if-no-files-found: ignore
          retention-days: 7

  microservice-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: softw_test
          MYSQL_USER: softw
          MYSQL_PASSWORD: softw_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: softw
      DB_PASSWORD: softw_password
      JWT_SECRET: test_microservice_secret
      INTERNAL_SERVICE_TOKEN: test_internal_token
    strategy:
      matrix:
        include:
          - service: user-service
            database: softw_users_test
          - service: product-service
            database: softw_catalog_test
          - service: order-service
            database: softw_orders_test
          - service: api-gateway
            database: softw_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create isolated service database
        env:
          MYSQL_PWD: root_password
        run: |
          mysql --host=127.0.0.1 --user=root \
            --execute="CREATE DATABASE IF NOT EXISTS \`${{ matrix.database }}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON \`${{ matrix.database }}\`.* TO 'softw'@'%'; FLUSH PRIVILEGES;"
      - run: npm ci
        working-directory: services/${{ matrix.service }}
      - run: npm test
        working-directory: services/${{ matrix.service }}
        env:
          DB_NAME: ${{ matrix.database }}

  microservice-e2e:
    runs-on: ubuntu-latest
    env:
      RUN_API_E2E: '1'
      API_BASE_URL: http://127.0.0.1:8081
      HEALTH_PATH: /health
      E2E_BASE_URL: http://127.0.0.1:8082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start complete microservice topology
        run: docker compose -f 03_devops/docker-compose.microservices.yml up -d --build --wait
      - name: Run complete API flow through gateway
        run: npm run test:api
        working-directory: backend
      - name: Run browser flows through gateway
        run: npm run test:e2e
        working-directory: frontend
      - name: Collect microservice status and logs
        if: always()
        run: |
          docker compose -f 03_devops/docker-compose.microservices.yml ps || true
          docker compose -f 03_devops/docker-compose.microservices.yml logs --no-color > microservice-compose.log || true
      - name: Upload microservice failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: microservice-e2e-failure-${{ github.sha }}
          path: |
            frontend/test-results
            04_tests/reports/playwright-html
            microservice-compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop microservice topology
        if: always()
        run: docker compose -f 03_devops/docker-compose.microservices.yml down -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, browser-e2e, microservice-test, microservice-e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:practice
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:practice
      - name: Build microservice frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.microservices
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/microservice-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/microservice-frontend:practice
      - name: Build api gateway image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/api-gateway/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api-gateway:practice
      - name: Build user service image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/user-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/user-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/user-service:practice
      - name: Build product service image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/product-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/product-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/product-service:practice
      - name: Build order service image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/order-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/order-service:practice

  kubernetes-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Create deployment cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: softw-ci
          version: v0.32.0
          wait: 120s
      - name: Deploy monolith and microservices
        run: |
          kubectl apply -f 03_devops/k8s/monolith
          kubectl apply -f 03_devops/k8s/microservices/00-namespace.yaml
          kubectl -n softw-practice create secret docker-registry ghcr-credentials \
            --docker-server=${REGISTRY} \
            --docker-username=${GITHUB_ACTOR} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n softw-practice patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-credentials"}]}'
          kubectl -n softw-microservices create secret docker-registry ghcr-credentials \
            --docker-server=${REGISTRY} \
            --docker-username=${GITHUB_ACTOR} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n softw-microservices patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-credentials"}]}'
          kubectl apply -f 03_devops/k8s/microservices
          kubectl -n softw-practice set image deployment/backend \
            backend=${IMAGE_PREFIX}/backend:${GITHUB_SHA}
          kubectl -n softw-practice set image deployment/frontend \
            frontend=${IMAGE_PREFIX}/frontend:${GITHUB_SHA}
          kubectl -n softw-microservices set image deployment/api-gateway \
            api-gateway=${IMAGE_PREFIX}/api-gateway:${GITHUB_SHA}
          kubectl -n softw-microservices set image deployment/user-service \
            user-service=${IMAGE_PREFIX}/user-service:${GITHUB_SHA}
          kubectl -n softw-microservices set image deployment/product-service \
            product-service=${IMAGE_PREFIX}/product-service:${GITHUB_SHA}
          kubectl -n softw-microservices set image deployment/order-service \
            order-service=${IMAGE_PREFIX}/order-service:${GITHUB_SHA}
          kubectl -n softw-microservices set image deployment/microservice-frontend \
            frontend=${IMAGE_PREFIX}/microservice-frontend:${GITHUB_SHA}
      - name: Wait for deployments
        run: |
          kubectl -n softw-practice rollout status deployment/mysql --timeout=300s
          kubectl -n softw-practice rollout status deployment/backend --timeout=300s
          kubectl -n softw-practice rollout status deployment/frontend --timeout=300s
          kubectl -n softw-microservices rollout status deployment/microservice-mysql --timeout=300s
          kubectl -n softw-microservices rollout status deployment/user-service --timeout=180s
          kubectl -n softw-microservices rollout status deployment/product-service --timeout=180s
          kubectl -n softw-microservices rollout status deployment/order-service --timeout=180s
          kubectl -n softw-microservices rollout status deployment/api-gateway --timeout=180s
          kubectl -n softw-microservices rollout status deployment/microservice-frontend --timeout=180s
      - name: Verify health from inside Kubernetes
        run: |
          kubectl -n softw-practice run monolith-healthcheck \
            --image=curlimages/curl:8.16.0 --restart=Never --rm -i \
            --command -- curl --fail --silent http://backend:3001/api/health
          kubectl -n softw-microservices run microservices-healthcheck \
            --image=curlimages/curl:8.16.0 --restart=Never --rm -i \
            --command -- curl --fail --silent http://api-gateway:8080/health
          kubectl -n softw-microservices run microservice-frontend-healthcheck \
            --image=curlimages/curl:8.16.0 --restart=Never --rm -i \
            --command -- curl --fail --silent http://microservice-frontend/
      - name: Show deployed workloads
        if: always()
        run: |
          kubectl -n softw-practice get pods,deployments,services
          kubectl -n softw-microservices get pods,deployments,services,hpa
